<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Fonts & CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <!-- Theme script runs immediately to prevent flash -->
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
</head>
<body>

  <header class="site-header">
    <div class="site-wrapper">

      <a href="{{ '/' | relative_url }}" class="site-title">Cameron Loudon</a>

      <nav class="site-nav">
        <a href="{{ '/about' | relative_url }}">About</a>
        <a href="{{ '/ideas' | relative_url }}">Ideas</a>
        <a href="{{ '/signals' | relative_url }}">Signals</a>
        <a href="{{ '/now' | relative_url }}">Now</a>
        <a href="{{ '/approach' | relative_url }}">Approach</a>
        <a href="{{ '/contact' | relative_url }}">Contact</a>

        <!-- Theme Toggle -->
        <div class="theme-toggle" role="group" aria-label="Choose colour theme">
          <button class="theme-btn active" data-mode="light" title="Light mode">Light</button>
          <button class="theme-btn" data-mode="dark" title="Dark mode">Dark</button>
          <button class="theme-btn" data-mode="terminal" title="Fallout Terminal mode">&gt;_</button>
          <button class="theme-btn" data-mode="tree" title="Folder Tree mode">~/</button>
        </div>
      </nav>

    </div>
  </header>

  <main class="site-main">
    <div class="site-wrapper">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-wrapper">
      <p>© {{ site.time | date: '%Y' }} Cameron Loudon</p>
      <p>Built with radical transparency. <a href="{{ '/approach' | relative_url }}">Read the approach →</a></p>
    </div>
  </footer>


  {% if page.mermaid %}
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <style>
    .mermaid-hint {
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      margin-top: 0.25rem;
      cursor: pointer;
    }
    .mermaid { cursor: pointer; }
    .mermaid-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .mermaid-overlay-content {
      background: white;
      border-radius: 8px;
      padding: 2rem;
      max-width: 95vw;
      max-height: 90vh;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    .mermaid-overlay-content svg {
      width: 100% !important;
      height: auto !important;
      max-width: none !important;
    }
    .mermaid-close {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: white;
      border: none;
      border-radius: 50%;
      width: 2.75rem;
      height: 2.75rem;
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }
  </style>
  <script>
    // Step 1: transform Kramdown output (code.language-mermaid) into Mermaid-readable divs
    document.querySelectorAll('code.language-mermaid').forEach(el => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = el.textContent;
      el.parentElement.replaceWith(div);
    });

    // Step 2: initialise without startOnLoad, then use mermaid.run() Promise
    // so lightbox handlers attach only after rendering is complete
    mermaid.initialize({ startOnLoad: false, theme: 'neutral' });

    mermaid.run({ nodes: document.querySelectorAll('.mermaid') }).then(() => {
      document.querySelectorAll('.mermaid').forEach(diagram => {
        // Add tap hint
        const hint = document.createElement('p');
        hint.className = 'mermaid-hint';
        hint.textContent = '🔍 Tap to expand';
        diagram.insertAdjacentElement('afterend', hint);

        // Open lightbox on diagram or hint click
        [diagram, hint].forEach(el => el.addEventListener('click', () => openLightbox(diagram)));
      });
    });

    function openLightbox(diagram) {
      // Lock background scroll (fixes iOS Safari)
      document.body.style.overflow = 'hidden';

      const overlay = document.createElement('div');
      overlay.className = 'mermaid-overlay';

      const content = document.createElement('div');
      content.className = 'mermaid-overlay-content';
      content.innerHTML = diagram.innerHTML;

      const close = document.createElement('button');
      close.className = 'mermaid-close';
      close.innerHTML = '✕';

      function closeOverlay() {
        document.body.style.overflow = '';
        document.body.removeChild(overlay);
      }

      close.addEventListener('click', closeOverlay);
      overlay.addEventListener('click', e => { if (e.target === overlay) closeOverlay(); });

      overlay.appendChild(close);
      overlay.appendChild(content);
      document.body.appendChild(overlay);
    }
  </script>
  {% endif %}

</body>
</html>
